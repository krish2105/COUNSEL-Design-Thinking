name: check

# The whole suite runs with no model, no key and no network: the stub provider
# is the CI substrate and the search chain degrades to fixtures. A test suite
# whose result depends on a language model is not a test suite.
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --extra dev --extra cloud
      - run: uv run ruff check services tests scripts
      - run: uv run ruff format --check services tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/placeholder_scan.py

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/check-contrast.mjs
      - run: npm run build
